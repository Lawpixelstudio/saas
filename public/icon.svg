<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goolo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38A5F8" />
      <stop offset="100%" stop-color="#1d8fe6" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D81159" />
      <stop offset="100%" stop-color="#b80c49" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1d8fe6" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#goolo-grad)" />
  
  <!-- Subtle inner border overlay -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />
  
  <!-- Graphic Elements: Layers & Code Network -->
  <g transform="translate(106, 106)" filter="url(#shadow)">
    <!-- Bottom layer -->
    <path d="M150 20 L280 90 L150 160 L20 90 Z" fill="#ffffff" fill-opacity="0.25" />
    <path d="M20 90 L150 160 L150 185 L20 115 Z" fill="#0f4977" fill-opacity="0.3" />
    <path d="M280 90 L150 160 L150 185 L280 115 Z" fill="#0f4977" fill-opacity="0.4" />
    
    <!-- Middle layer -->
    <path d="M150 75 L280 145 L150 215 L20 145 Z" fill="#ffffff" fill-opacity="0.5" />
    <path d="M20 145 L150 215 L150 240 L20 170 Z" fill="#0f4977" fill-opacity="0.3" />
    <path d="M280 145 L150 215 L150 240 L280 170 Z" fill="#0f4977" fill-opacity="0.4" />
    
    <!-- Top layer with vibrant white surface -->
    <path d="M150 130 L280 200 L150 270 L20 200 Z" fill="#FFFFFF" />
    <path d="M20 200 L150 270 L150 295 L20 225 Z" fill="#e2e8f0" />
    <path d="M280 200 L150 270 L150 295 L280 225 Z" fill="#cbd5e1" />

    <!-- Magenta Status Orb Accent -->
    <circle cx="150" cy="180" r="24" fill="url(#accent-grad)" stroke="#ffffff" stroke-width="6" />
  </g>
</svg>
